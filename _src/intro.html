<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ALMA Burger &amp; Breakfast · Ordizia</title>
<meta name="description" content="Hamburguesas y desayunos en Ordizia. No es solo comida. Es ALMA.">
<meta name="theme-color" content="#fbecd8">
<link rel="icon" type="image/png" href="negro/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
:root{--cream:#fbecd8;--ink:#0b0b0b;--navy:#032164}
html,body{min-height:100%}
body{background:var(--cream);color:var(--ink);font-family:'Big Shoulders Display',system-ui,sans-serif;overflow-x:hidden;-webkit-font-smoothing:antialiased}
.intro{display:flex;justify-content:center;overflow:hidden}
.stage{position:relative;width:min(92vw,760px);min-height:100svh;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:clamp(10px,2.4vh,26px);padding:56px 0 20px}
.logo{width:min(80vw,500px,52svh);height:auto;opacity:0;transform:scale(.2) rotate(-8deg);animation:logoIn .9s cubic-bezier(.2,1.6,.4,1) .25s forwards}
@keyframes logoIn{to{opacity:1;transform:none}}
.logo.wob{animation:logoIn .9s cubic-bezier(.2,1.6,.4,1) .25s forwards,wob .5s ease-in-out 2.3s 2}
@keyframes wob{50%{transform:scale(1.04) rotate(-2deg)}}
.crew{position:relative;width:min(92vw,620px);height:clamp(120px,24vw,175px);border-bottom:3px dashed rgba(11,11,11,.45);flex:none}
.ch{position:absolute;bottom:-2px}
.burger{left:6%;width:clamp(96px,20vw,150px);transform:translateX(-120vw);animation:inL 1.3s cubic-bezier(.3,.9,.4,1) .9s forwards}
.dog{right:6%;width:clamp(104px,21vw,160px);transform:translateX(120vw);animation:inR 1.3s cubic-bezier(.3,.9,.4,1) 1.1s forwards}
@keyframes inL{to{transform:none}}
@keyframes inR{to{transform:none}}
.jump{animation:jump .55s cubic-bezier(.3,1.5,.5,1) 2.3s 2 alternate;transform-origin:50% 100%}
.dog .jump{animation-delay:2.45s}
@keyframes jump{to{transform:translateY(-30%) rotate(-6deg)}}
/* burger: cuerpo y piernas */
.rig{position:relative;width:100%;aspect-ratio:396/343}
.rig img{position:absolute;inset:0;width:100%;height:100%}
.rig .bob{position:absolute;inset:0;animation:bob .34s ease-in-out infinite alternate}
.rig .body{transform-origin:50% 62%;animation:sway .68s ease-in-out infinite alternate}
.rig .legL{transform-origin:42.4% 62.4%;animation:stepL .34s ease-in-out infinite alternate}
.rig .legR{transform-origin:51.3% 62.4%;animation:stepR .34s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-4%)}}
@keyframes sway{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
@keyframes stepL{from{transform:rotate(-17deg)}50%{transform:rotate(0) translateY(-3%)}to{transform:rotate(17deg)}}
@keyframes stepR{from{transform:rotate(17deg)}50%{transform:rotate(0) translateY(-3%)}to{transform:rotate(-17deg)}}
/* perrito */
.dog img.hd{display:block;width:100%;height:auto;transform-origin:50% 92%;animation:dogw .42s ease-in-out infinite alternate}
@keyframes dogw{from{transform:rotate(-5deg) translateY(0)}to{transform:rotate(5deg) translateY(-5%)}}
.bubble{position:absolute;bottom:calc(clamp(96px,20vw,150px) * .92);z-index:2;background:#fff;border:3px solid var(--ink);border-radius:16px 16px 16px 4px;padding:6px 12px;font-weight:800;font-size:clamp(.9rem,2.4vw,1.15rem);opacity:0;transform:scale(.6);white-space:nowrap}
.b1{left:8%;animation:pop .35s 2.05s forwards}
.b2{right:8%;border-radius:16px 16px 4px 16px;animation:pop .35s 2.35s forwards}
@keyframes pop{to{opacity:1;transform:none}}
/* elección de color */
.choose{text-align:center;opacity:0;transform:translateY(18px);animation:up .5s ease 3.1s forwards;padding:0 12px;width:100%}
@keyframes up{to{opacity:1;transform:none}}
.choose h1{font-weight:900;font-size:clamp(1.6rem,5vw,2.4rem);text-transform:uppercase;letter-spacing:.01em;margin-bottom:12px}
.opts{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.opt{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;border:3px solid var(--ink);border-radius:999px;padding:10px 22px 10px 12px;background:#fff8ee;box-shadow:0 5px 0 var(--ink);font-weight:900;font-size:1.25rem;text-transform:uppercase;transition:transform .15s}
.opt:hover{transform:translateY(-3px)}
.opt:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.opt i{width:34px;height:34px;border-radius:50%;border:3px solid var(--ink);background:linear-gradient(135deg,var(--c) 0 50%,var(--cream) 50%)}
.opt--azul{border-color:var(--navy);color:var(--navy);box-shadow:0 5px 0 var(--navy)}
.opt--azul i{border-color:var(--navy)}
.opt.last{outline:3px dashed currentColor;outline-offset:4px}
.note{margin-top:12px;font-size:.95rem;opacity:.75;font-weight:500}
.skip{position:fixed;top:14px;right:14px;z-index:5;border:2.5px solid var(--ink);background:#fff8ee;border-radius:999px;padding:6px 16px;font:inherit;font-weight:800;font-size:1rem;cursor:pointer;text-transform:uppercase}
/* saltar o sin movimiento: estado final directo */
.done *,.done *::before{animation-duration:0s!important;animation-delay:0s!important}
.done .rig .bob,.done .rig .body,.done .rig .legL,.done .rig .legR,.done .dog img.hd{animation:none!important}
.done .skip{display:none}
@media (prefers-reduced-motion:reduce){*,*::before{animation-duration:0s!important;animation-delay:0s!important;animation-iteration-count:1!important}.skip{display:none}}

</style>
</head>
<body>
<main class="intro" id="intro">
  <button class="skip" type="button" id="skip">Saltar</button>
  <div class="stage">
      <img class="logo wob" src="negro/img/logo-big.png" alt="ALMA Burger &amp; Breakfast" width="1100" height="799">
      <div class="crew">
      <span class="bubble b1" aria-hidden="true">¡Hola!</span>
      <span class="bubble b2" aria-hidden="true">¡Ñam!</span>
      <div class="ch burger" aria-hidden="true"><div class="jump"><div class="rig"><div class="bob">
        <img class="legL" src="negro/img/mascot-legL.png" alt=""><img class="legR" src="negro/img/mascot-legR.png" alt=""><img class="body" src="negro/img/mascot-body.png" alt="">
      </div></div></div></div>
      <div class="ch dog" aria-hidden="true"><div class="jump">
        <img class="hd" src="negro/img/hotdog.png" alt="" width="600" height="601">
      </div></div>
    </div>
    <div class="choose">
      <h1>¿Cómo quieres ver la web?</h1>
      <div class="opts">
        <a class="opt opt--azul" href="azul/index.html" data-c="azul" style="--c:#032164"><i></i>Azul y crema</a>
        <a class="opt" href="negro/index.html" data-c="negro" style="--c:#0b0b0b"><i></i>Negro y crema</a>
      </div>
      <p class="note">Podrás cambiarlo cuando quieras desde el pie de la web.</p>
    </div>
  </div>
</main>
<script>
(function(){
  var root=document.getElementById('intro');
  document.getElementById('skip').addEventListener('click',function(){root.classList.add('done')});
  var last=null;try{last=localStorage.getItem('alma-color')}catch(e){}
  document.querySelectorAll('.opt').forEach(function(a){
    if(a.dataset.c===last)a.classList.add('last');
    a.addEventListener('click',function(){try{localStorage.setItem('alma-color',a.dataset.c)}catch(e){}});
  });
})();
</script>
</body>
</html>
